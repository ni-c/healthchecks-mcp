<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOURCE FILE — the one place the architecture diagram is edited.

  `npm run assets` turns this into four rendered copies, which are the files that
  actually get shown:

    docs/public/architecture-light.svg   GitHub in its light theme
    docs/public/architecture-dark.svg    GitHub in its dark theme
    docs/public/architecture.svg         npm, and anything that strips <picture>
    docs/index.md                        inline, follows the VitePress theme toggle

  Geometry and labels only: no colours, no <style>. Everything is expressed through
  the class contract that docs/.vitepress/theme/custom.css defines — .node,
  .node-accent, .edge, .edge-accent, .edge-dashed, .label-title, .label-mono,
  .label-muted — and the generator supplies a matching palette per output.

  The fourth box is the point of this particular diagram: the monitored jobs ping
  Healthchecks themselves, on a path this server is not on and deliberately cannot
  join. Do not write a raw "&" in a label — the SVG is inlined into a VitePress page,
  which compiles it as a Vue template.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How healthchecks-mcp connects an MCP client to Healthchecks</title>
  <desc id="arch-desc">An MCP client talks to healthchecks-mcp over stdio. The server calls the Healthchecks Management API v3 over HTTPS. The monitored jobs ping Healthchecks directly, on a path the server is not on.</desc>

  <defs>
    <marker id="arch-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" />
    </marker>
    <marker id="arch-arrow-accent" class="accent" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" />
    </marker>
  </defs>

  <rect class="node" x="20" y="70" width="160" height="80" rx="10" />
  <text class="label-title" x="100" y="103" text-anchor="middle">MCP client</text>
  <text class="label-muted" x="100" y="123" text-anchor="middle">Claude, Codex, …</text>

  <rect class="node-accent" x="280" y="60" width="170" height="100" rx="10" />
  <text class="label-title" x="365" y="93" text-anchor="middle">healthchecks-mcp</text>
  <text class="label-muted" x="365" y="113" text-anchor="middle">14 tools, 7 essential</text>
  <text class="label-muted" x="365" y="133" text-anchor="middle">asks a person</text>

  <rect class="node" x="550" y="70" width="150" height="80" rx="10" />
  <text class="label-title" x="625" y="103" text-anchor="middle">Healthchecks</text>
  <text class="label-muted" x="625" y="123" text-anchor="middle">cron and uptime</text>

  <path class="edge-accent" d="M180,110 L272,110" marker-end="url(#arch-arrow-accent)" />
  <text class="label-mono" x="226" y="98" text-anchor="middle">stdio</text>

  <path class="edge-accent" d="M450,110 L542,110" marker-end="url(#arch-arrow-accent)" />
  <text class="label-mono" x="496" y="98" text-anchor="middle">HTTPS</text>
  <text class="label-muted" x="496" y="130" text-anchor="middle">/api/v3</text>

  <rect class="node" x="520" y="215" width="180" height="62" rx="10" />
  <text class="label-title" x="610" y="242" text-anchor="middle">Your jobs</text>
  <text class="label-muted" x="610" y="261" text-anchor="middle">cron, timers, backups</text>

  <path class="edge edge-dashed" d="M625,213 L625,158" marker-end="url(#arch-arrow)" />
  <text class="label-mono" x="655" y="190" text-anchor="start">ping</text>
</svg>
